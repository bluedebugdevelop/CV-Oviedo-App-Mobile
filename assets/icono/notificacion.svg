<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512"
     role="img" aria-label="Club Voleibol Oviedo">
  <title>CV Oviedo — icono pequeño de notificación</title>

  <!-- ======================================================================
       El escudo, reducido a lo único que Android deja pasar.

       El icono PEQUEÑO de una notificación no puede llevar color: el sistema
       se queda con el canal alfa y lo rellena entero con el color de acento.
       No es una decisión de diseño, es cómo funciona Android. Así que aquí no
       hay ni aro amarillo, ni pista naranja, ni balones: solo forma.

       De todo el escudo sobreviven las dos cosas que lo identifican a 24 dp:
       el disco y el monograma CVO calado dentro. Se probaron seis siluetas
       —aro solo, aro con monograma, aro con la V, disco con la V, aro fino—
       renderizadas a 24, 32, 48 y 96 px sobre fondo claro y oscuro. El disco
       lleno gana por goleada: es lo único que a 24 dp no se deshace, porque
       la tinta es maciza y las letras se leen como huecos, no como trazos.

       El monograma es el mismo del escudo (mismos caminos, misma proporción)
       pero con los trazos a 66 donde el original lleva 13, y al 78% para que
       quede disco por los cuatro lados. Con menos grosor las letras se cierran
       al reducir; con más, se comen el disco.

       El escudo COMPLETO y en color sí aparece en la notificación: va como
       icono grande, a la derecha de la tarjeta. Ver plugins/icono-grande.js.
       ====================================================================== -->

  <mask id="cvo-monograma">
    <circle cx="256" cy="256" r="228" fill="#ffffff"/>
    <g transform="translate(256 256) scale(0.78) translate(-260 -253)">
      <g fill="none" stroke="#000000" stroke-linecap="round">
        <path d="M 192.5 153.3 A 34 129 0 1 0 192.5 364.7" stroke-width="66"/>
        <ellipse cx="360" cy="257" rx="23" ry="129" stroke-width="59.4"/>
      </g>
      <path d="M198,89 H252 V103 H240 L262,388 L293,103 H281 V89 H320 V103 H309 L274,418 H256 L206,103 H198 Z"
            fill="#000000" stroke="#000000" stroke-width="19.8" stroke-linejoin="round"/>
    </g>
  </mask>

  <circle cx="256" cy="256" r="228" fill="#ffffff" mask="url(#cvo-monograma)"/>
</svg>
