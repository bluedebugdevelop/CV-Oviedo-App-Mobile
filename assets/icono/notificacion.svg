<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512"
     role="img" aria-label="Club Voleibol Oviedo">
  <title>CV Oviedo — icono pequeño de notificación</title>

  <!-- ======================================================================
       El escudo, reducido a lo único que Android deja pasar.

       El icono PEQUEÑO de una notificación no puede llevar color: el sistema
       se queda con el canal alfa y lo rellena entero con el color de acento.
       No es una decisión de diseño, es cómo funciona Android. Así que aquí no
       hay ni aro amarillo, ni pista naranja, ni balones: solo forma.

       De todo el escudo sobreviven las dos cosas que lo identifican: el disco
       y el monograma CVO calado dentro. Se probaron seis siluetas —aro solo,
       aro con monograma, aro con la V, disco con la V, aro fino— a 24, 32, 48
       y 96 px sobre fondo claro y oscuro. El disco lleno gana: es lo único que
       a 24 dp no se deshace, porque la tinta es maciza y las letras se leen
       como huecos, no como trazos.

       POR QUÉ LAS LETRAS NO SON LAS DEL ESCUDO
       En el escudo la C y la V se solapan —la V nace dentro de la C— y la O
       queda pegada al otro lado. Eso a tamaño grande es la gracia del
       monograma, pero a 24 dp las tres se funden en una mancha: se leía «CV»
       porque la O desaparecía contra la V. Así que aquí van separadas, con
       hueco real entre ellas, y con las formas simplificadas —la V sin sus
       remates, la O como anillo limpio— porque a este tamaño ese detalle no
       llega a dibujarse y solo emborrona.

       Los números salen de comparar cinco combinaciones de altura, grosor y
       separación, renderizadas y miradas a 24 px: con las letras más altas se
       tocan, con el trazo más fino se lavan.

       El escudo COMPLETO y en color sí aparece en la notificación: va como
       icono grande, a la derecha de la tarjeta. Ver plugins/icono-grande.js.
       ====================================================================== -->

  <mask id="cvo-monograma">
    <circle cx="256" cy="256" r="228" fill="#ffffff"/>
    <g fill="none" stroke="#000000" stroke-width="46"
       stroke-linecap="round" stroke-linejoin="round">
      <!-- C · arco de elipse abierto por la derecha -->
      <path d="M 141.9 175.6 A 34 105 0 1 0 141.9 336.4"/>
      <!-- V -->
      <path d="M 179.3 151 L 256 361 L 332.7 151"/>
      <!-- O -->
      <ellipse cx="392" cy="256" rx="34" ry="105"/>
    </g>
  </mask>

  <circle cx="256" cy="256" r="228" fill="#ffffff" mask="url(#cvo-monograma)"/>
</svg>
