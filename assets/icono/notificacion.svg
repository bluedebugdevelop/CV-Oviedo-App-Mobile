<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512"
     role="img" aria-label="CV Oviedo">
  <title>CV Oviedo — icono pequeño de notificación</title>

  <!-- ======================================================================
       El monograma del club, y solo el monograma.

       El icono PEQUEÑO de una notificación no puede llevar color: Android se
       queda con el canal alfa y lo rellena entero con el color de acento. No
       es una decisión de diseño, es cómo funciona. Así que del escudo no puede
       sobrevivir ni el aro amarillo, ni la pista, ni los balones: solo forma.

       Y a 24 dp tampoco sobrevive el escudo entero. Se probó de todo —el aro
       con el monograma dentro, el disco lleno con las letras caladas, el aro
       solo— renderizado y mirado a 24, 32, 48 y 96 px sobre claro y oscuro.
       Todo lo que mete el disco alrededor roba el sitio que necesitan las
       letras: dentro de 24 px caben tres letras O un disco, no las dos cosas.
       Con el disco se leía «CV», porque la O se fundía contra la V.

       Así que van las letras solas, a sangre, con los extremos redondeados.

       LOS NÚMEROS
       Trazo 9 sobre 100, letras de 10 de medio ancho y 34 de media altura. Se
       compararon cinco combinaciones a 24 px: con el trazo a 10 u 11 el ojo de
       la O se cierra y vuelve a leerse «CV»; con las letras más anchas se
       tocan entre ellas. Esta es la que deja el contraojo abierto sin que el
       trazo se lave.

       Las formas son las del escudo —C y O como elipses altas y estrechas, V
       en pico— pero simplificadas: sin los remates de la V, que a este tamaño
       no llegan a dibujarse y solo emborronan.

       El escudo COMPLETO y en color sí aparece en la notificación: va como
       icono grande, a la derecha de la tarjeta. Ver plugins/icono-grande.js.
       ====================================================================== -->

  <g fill="none" stroke="#ffffff" stroke-width="9"
     stroke-linecap="round" stroke-linejoin="round">
    <!-- C · arco de elipse abierto por la derecha -->
    <path d="M 24.93 23.95 A 10 34 0 1 0 24.93 76.05"/>
    <!-- V -->
    <path d="M 40 16 L 50 84 L 60 16"/>
    <!-- O -->
    <ellipse cx="81.5" cy="50" rx="10" ry="34"/>
  </g>
</svg>
